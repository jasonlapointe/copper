name: Deploy (Cloud Run)

# Deploys copper-bot to Cloud Run on every merge to master (and on manual dispatch).
# Gated by the DEPLOY_ENABLED repo variable so it only runs once configured.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SERVICE: copper-bot
  REGION: us-central1

jobs:
  # Gate: the product must compile before we build an image or touch the running service.
  # CI (ci.yml) is the PR gate; this repeats the bot build so a direct push to master that
  # somehow bypassed a green PR can't deploy code that doesn't compile.
  build:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build copper-bot
        working-directory: bot
        run: dotnet build --configuration Release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Guard so it no-ops until the deploy secret is configured.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # The image is tagged by the exact commit SHA, so every deploy is traceable and any
    # prior SHA can be redeployed to roll back (see RELEASE.md).
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/copper/copper-bot:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build & push image (from bot/)
        # --default-buckets-behavior=regional-user-owned-bucket makes Cloud Build write logs
        # to a regional bucket in THIS project (copper-deploy has roles/storage.admin) instead
        # of the shared Google-owned default logs bucket the deploy SA cannot view — which is
        # what made the previous run fail at this step.
        run: |
          gcloud builds submit bot \
            --tag "$IMAGE" \
            --default-buckets-behavior=regional-user-owned-bucket

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "PUBLIC_URL=https://$SERVICE-${{ secrets.GCP_PROJECT_NUMBER }}.$REGION.run.app,GCP_PROJECT=${{ secrets.GCP_PROJECT }},COPPER_REGION=global,COPPER_MODEL=gemini-2.5-flash,COPPER_LANGS=en\,ru" \
            --set-secrets "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest"
      # Gemini runs on Vertex AI — the Cloud Run service account authenticates, so no API key.
      # On boot the service calls Telegram setWebhook to its own Cloud Run URL (PUBLIC_URL).

      - name: Verify deploy (health check)
        # Fail the job if the new revision isn't serving. GET / must return "copper-bot ok".
        # Retry to absorb Cloud Run cold start on the first hit.
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Health-checking $URL/"
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 15 "$URL/" || true)
            echo "attempt $i: '$body'"
            if [ "$body" = "copper-bot ok" ]; then
              echo "Service healthy."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Service did not return 'copper-bot ok' after deploy."
          exit 1
