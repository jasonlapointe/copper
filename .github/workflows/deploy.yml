name: Deploy (Cloud Run)

# Deploys copper-bot to Cloud Run on every merge to master (and on manual dispatch).
# Gated by the DEPLOY_ENABLED repo variable so it only runs once configured.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SERVICE: copper-bot
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Guard so it no-ops until the deploy secret is configured.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build & push image (from bot/)
        run: |
          gcloud builds submit bot \
            --tag "$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/copper/$SERVICE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/copper/$SERVICE:${{ github.sha }}" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "PUBLIC_URL=https://$SERVICE-${{ secrets.GCP_PROJECT_NUMBER }}.$REGION.run.app,GCP_PROJECT=${{ secrets.GCP_PROJECT }},COPPER_REGION=global,COPPER_MODEL=gemini-2.5-flash,COPPER_LANGS=en\,ru" \
            --set-secrets "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest"
      # Gemini runs on Vertex AI — the Cloud Run service account authenticates, so no API key.
      # On boot the service calls Telegram setWebhook to its own Cloud Run URL (PUBLIC_URL).
